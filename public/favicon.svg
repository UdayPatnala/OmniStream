<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7000FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#030208" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="128" height="128" rx="32" fill="#0A0814" />
  <circle cx="64" cy="64" r="54" fill="url(#glowGrad)" />

  <!-- Outer Orbit Ring / Stream Waves -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#omniGrad)" stroke-width="3" stroke-dasharray="16 8" stroke-linecap="round" opacity="0.6" />
  
  <!-- Central Glowing Prism Play Symbol -->
  <g filter="url(#neonGlow)">
    <path d="M52 40 L88 64 L52 88 Z" fill="url(#omniGrad)" />
    <!-- Dynamic Infinity Stream Arc -->
    <path d="M42 64 C 42 46, 64 46, 76 56 C 88 66, 110 66, 110 48" fill="none" stroke="#00F0FF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
